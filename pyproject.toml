[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchmarketdata"
version = "0.1.0"
description = "CLI utility for downloading BingX historical candlestick data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11",
  "pytest>=8.0",
  "setuptools>=68",
  "wheel",
]

[project.scripts]
bingx-fetch = "bingx_fetch:main"

[tool.setuptools]
py-modules = ["bingx_fetch"]
